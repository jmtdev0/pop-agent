[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pop-agent"
version = "0.1.0"
description = "Nightly GitHub #pop issue-comment agent"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pop-agent = "pop_agent.agent:main"

[tool.setuptools.packages.find]
include = ["pop_agent*"]

